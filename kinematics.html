<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>
Kinematics | Physics G12
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>
  <header>

<a href="chapters.html"
class="back-btn">

← Back

</a>

<h1>

Chapter 1

Kinematics

</h1>

  </header>
  <div class="accordion-item">

<button class="accordion-btn">

📖 Summary

</button>

<div class="accordion-content">

<p>

Kinematics is the study
of motion.

It explains distance,
displacement,
speed,
velocity,
and acceleration.

It describes motion
without considering
the forces that cause it.

</p>

</div>

  </div>
  <div class="accordion-item">

<button class="accordion-btn">

🖼 Visual Summary

</button>

<div class="accordion-content">

<img

src="images/
kinematics-summary.jpg"

class="summary-image"

alt="Kinematics Summary">

</div>

  </div>
  <div class="accordion-item">

<button class="accordion-btn">

🧪 Experiment Lab

</button>

<div class="accordion-content">

<label>

Speed (m/s)

</label>

<input
type="number"
id="speed">

<label>

Time (s)

</label>

<input
type="number"
id="time">

<button
onclick="calculateDistance()">

Calculate

</button>

<p id="result">

</p>

</div>

  </div>
  <div class="accordion-item">

<button class="accordion-btn">

📝 Quiz

</button>

<div class="accordion-content">

<p>

If a car travels
10 m/s for 5 s,
what distance
does it travel?

</p>

<button onclick="checkAnswer(50)">
50 m
</button>

<button onclick="checkAnswer(20)">
20 m
</button>

<button onclick="checkAnswer(10)">
10 m
</button>

<p id="quizResult">

</p>

</div>

  </div>
  <script>

function calculateDistance(){

let speed =
document
.getElementById("speed")
.value;

let time =
document
.getElementById("time")
.value;

let distance =
speed * time;

document
.getElementById("result")
.innerHTML =

"Distance = "
+ distance
+ " m";

}

function checkAnswer(ans){

if(ans == 50){

document
.getElementById(
"quizResult")
.innerHTML =

"✅ Correct";

}

else{

document
.getElementById(
"quizResult")
.innerHTML =

"❌ Wrong";

}

}

  </script>
  </body>
</html>
