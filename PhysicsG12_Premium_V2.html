<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics G12 Premium</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111}
.top{padding:20px;display:flex;justify-content:space-between}
.card{background:#fff;margin:16px;border-radius:20px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.btn{background:#2563eb;color:#fff;padding:10px 16px;border-radius:12px;text-decoration:none}
.hidden{display:none}
</style>
</head>
<body>
<div id="chapters">
<div class="top"><h2>Physics G12</h2><button onclick="toggle()">🌙</button></div>
<div class="card"><h3>01 Kinematics</h3><p>Motion, Velocity & Acceleration</p><a href="#" class="btn" onclick="openChapter()">Open</a></div>
<div class="card"><h3>02 Newton's Laws</h3></div>
<div class="card"><h3>03 Work & Energy</h3></div>
</div>

<div id="chapter1" class="hidden">
<div class="top"><a href="#" onclick="back()">← Back</a></div>
<div class="card">
<h2>Chapter 1 - Kinematics</h2>
<p>Study of motion.</p>
<h3>Formula</h3>
<p>v = u + at</p>
<h3>Live Action Demo</h3>
<div style="height:80px;position:relative;border:1px solid #ddd;border-radius:10px;overflow:hidden">
<div id="car" style="width:40px;height:20px;background:#2563eb;position:absolute;top:30px;left:0;animation:move 3s linear infinite"></div>
</div>
<h3>Quiz</h3>
<p>What is velocity?</p>
</div>
</div>

<script>
function openChapter(){document.getElementById('chapters').classList.add('hidden');document.getElementById('chapter1').classList.remove('hidden');}
function back(){document.getElementById('chapter1').classList.add('hidden');document.getElementById('chapters').classList.remove('hidden');}
function toggle(){document.body.style.background=document.body.style.background=='rgb(15, 23, 42)'?'#f8fafc':'#0f172a';document.body.style.color=document.body.style.color=='white'?'#111':'white';}
</script>
<style>@keyframes move{from{left:0}to{left:85%}}</style>
</body>
</html>
