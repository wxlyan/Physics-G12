<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics G12</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="poster">

<div class="dot-grid d1"></div>
<div class="dot-grid d2"></div>
<div class="dot-grid d3"></div>

<div class="star s1">✦</div>

    <h1 class="title">Physics <span>G12</span></h1>

    <div class="title-divider">
        <span></span>

    <div class="name-pill">
        Daw Wai Wai Myo Htike (LMM)
    </div>
</section>

    <img src="assets/wave.svg" class="wave" alt="wave">
    <img src="assets/circuit.svg" class="circuit" alt="circuit">
</section>

<div class="orbit-circle"></div>

<section class="contact">
    <img src="assets/phone.svg" class="phone-icon" alt="phone">

    <div class="phone-divider">
        <span></span>
        <div class="dot"></div>
        <span></span>
    </div>

    <div class="phone-number">09256224103</div>
</section>

<div class="wave-bg">
    <div class="wave-line wave1"></div>
    <div class="wave-line wave2"></div>
    <div class="wave-line wave3"></div>
    <div class="wave-line wave4"></div>
    <div class="wave-line wave5"></div>
</div>

</div>
